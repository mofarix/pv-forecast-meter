name: PV-Prognose
version: "0.1.0"
slug: pv_forecast
description: PV-Leistungsprognose (pvlib + Open-Meteo) als Sensoren und Dashboard
url: https://github.com/mofarix/pv-forecast-meter
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
hassio_api: true
homeassistant_api: true
services:
  - mqtt:want
ingress: true
ingress_port: 8099
panel_icon: mdi:solar-power-variant
panel_title: PV-Prognose
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Direkter Zugriff auf API und Dashboard ohne Ingress (optional, z. B. für REST-Sensoren)
options:
  site: {}
  systems:
    - name: pv_system_1
      label: Dach Südost
      kWp: 15
      surface_azimuth: 135
      p_inv_ac_kW: 12.5
    - name: pv_system_2
      label: Dach Südwest
      kWp: 15
      surface_azimuth: 225
      p_inv_ac_kW: 12.5
  forecast_days: 7
  update_interval_min: 60
  publish_interval_min: 5
  publish: auto
  log_level: info
schema:
  site:
    latitude: float?
    longitude: float?
    altitude: float?
    timezone: str?
    surface_tilt: float(0,90)?
  systems:
    - name: "match(^[A-Za-z0-9_]+$)"
      label: str?
      active: bool?
      kWp: float(0,)
      surface_azimuth: float(0,360)?
      p_inv_ac_kW: float(0,)?
      faiman_u0: float(0,)?
      faiman_u1: float(0,)?
      wind_height_factor: float(0,)?
      gamma_pdc: float?
      dc_cable_loss: float(0,1)?
      system_loss: float(0,1)?
      eta_inv_nom: float(0,1)?
      dc_ac_ratio: float(0,)?
      horizon_profile: str?
  forecast_days: int(1,16)
  update_interval_min: int(5,1440)
  publish_interval_min: int(1,60)
  publish: list(auto|mqtt|rest|none)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_password: password?
  log_level: list(debug|info|warning|error)
